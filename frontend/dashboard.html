<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="images/favicon.png">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Campus Lost & Found Portal</h1>

    <button id="logoutBtn">Logout</button>

</header>

<div class="dashboard">

    <h2 id="welcomeText"></h2>

    <!-- Dashboard Statistics -->
    <div class="stats-container">

        <div class="stat-card">
            <h2 id="totalItems">0</h2>
            <p>Total Items</p>
        </div>

        <div class="stat-card">
            <h2 id="lostItems">0</h2>
            <p>Lost Items</p>
        </div>

        <div class="stat-card">
            <h2 id="foundItems">0</h2>
            <p>Found Items</p>
        </div>

    </div>
    <h2 style="margin-top:40px;">Recent Lost Items</h2>

<div id="recentItems" class="recent-items"></div>

    <div class="dashboard-grid">
        <a href="my-items.html" class="dashboard-card">

    <h2>📂</h2>

    <h3>My Reported Items</h3>

</a>

        <a href="report-item.html" class="dashboard-card">

            <h2>📦</h2>

            <h3>Report Lost Item</h3>

        </a>

        <a href="lost-items.html" class="dashboard-card">

            <h2>🔍</h2>

            <h3>View Lost Items</h3>

        </a>

        <a href="admin-claims.html"
           class="dashboard-card"
           id="adminBtn">

            <h2>🛡️</h2>

            <h3>Admin Claims</h3>

        </a>

    </div>

</div>
<script src="js/toast.js"></script>
<script src="js/app.js"></script>
<footer class="footer">

<p>

© 2026 Campus Lost & Found Portal |
Developed by Vishnu Reddy

</p>

</footer>
</body>
</html>
